<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biteboxx - Download App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: contain;
        }
        h1 {
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .store-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .store-btn {
            display: flex;
            align-items: center;
            background: #1a1a2e;
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .store-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(26, 26, 46, 0.3);
        }
        .store-btn .icon {
            width: 40px;
            height: 40px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        .store-btn .text {
            text-align: left;
        }
        .store-btn .text .label {
            font-size: 12px;
            opacity: 0.8;
        }
        .store-btn .text .title {
            font-size: 16px;
            font-weight: 600;
        }
        .loading {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #1a1a2e;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/assets/image/logo.png" alt="Biteboxx Logo" onerror="this.style.display='none'">
        </div>
        <h1>Biteboxx</h1>
        <p>Food Delivery Made Easy</p>
        
        <div class="store-buttons" id="storeButtons">
            <a href="#" class="store-btn" id="appStoreBtn" style="display: none;">
                <div class="icon">🍎</div>
                <div class="text">
                    <div class="label">Download on the</div>
                    <div class="title">App Store</div>
                </div>
            </a>
            <a href="#" class="store-btn" id="playStoreBtn" style="display: none;">
                <div class="icon">▶️</div>
                <div class="text">
                    <div class="label">GET IT ON</div>
                    <div class="title">Google Play</div>
                </div>
            </a>
        </div>
        
        <div class="loading" id="loading">
            <span class="spinner"></span>
            Detecting your device...
        </div>
    </div>

    <script>
        // App store URLs
        const APP_STORE_URL = 'https://apps.apple.com/in/app/biteboxx-food-delivery/id6748221338';
        const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.bitbox.user&hl=en-US&pli=1';
        const WEBSITE_URL = 'https://biteboxx.com';

        function detectDevice() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            // Check for iOS devices (iPhone, iPad, iPod)
            const isIOS = /iPad|iPhone|iPod/i.test(userAgent);
            
            // Check for Android devices
            const isAndroid = /Android/i.test(userAgent);
            
            // Check if it's a mobile device
            const isMobile = isIOS || isAndroid || /Mobile/i.test(userAgent);
            
            const loading = document.getElementById('loading');
            const appStoreBtn = document.getElementById('appStoreBtn');
            const playStoreBtn = document.getElementById('playStoreBtn');
            
            if (isIOS) {
                // iOS device - redirect to App Store
                loading.style.display = 'none';
                appStoreBtn.style.display = 'flex';
                appStoreBtn.href = APP_STORE_URL;
            } else if (isAndroid) {
                // Android device - redirect to Play Store
                loading.style.display = 'none';
                playStoreBtn.style.display = 'flex';
                playStoreBtn.href = PLAY_STORE_URL;
            } else {
                // Desktop or unknown - show both options
                loading.style.display = 'none';
                appStoreBtn.style.display = 'flex';
                playStoreBtn.style.display = 'flex';
                appStoreBtn.href = APP_STORE_URL;
                playStoreBtn.href = PLAY_STORE_URL;
            }
        }

        // Detect device on page load
        window.addEventListener('DOMContentLoaded', detectDevice);
    </script>
</body>
</html>
